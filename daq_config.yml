connections:
  keyence_plc1:
    type: keyence
    params:
      host: 192.168.2.40
      port: 8501
      unit: 0

  delta_tc_rtu:
    type: modbus_ascii
    params:
      port: COM23          # 串口名称
      baudrate: 38400      # 波特率
      bytesize: 7          # 数据位
      parity: E            # 校验位
      stopbits: 1          # 停止位
      slave_id: 1          # 从站地址
      timeout: 1.0         # 超时时间(秒)

  delta_dte10t:
    params:
      baudrate: 115200
      bytesize: 8
      parity: E
      port: COM8
      slave_id: 1
      stopbits: 1
    type: modbus_rtu

poll_interval: 1
