    connection_type: keyence
    device_type: DM
    start_addr: 6000
    quantity: 10
    data_type: uint16
    byte_order: abcd
    channel_prefix: keyence_dm
    channel_name: 压机当前位置
    unit: ''
    scale: 1.0
    offset: 0
  - byte_order: abcd
    channel_name: DTE_CH5当前温度
    channel_prefix: pv_ch5
    connection_id: delta_dte10t
    connection_type: modbus_rtu
    data_type: uint16
    device_type: holding
    offset: 0
    quantity: 1
    scale: 0.1
    start_addr: 4100
    task_id: task_dte_pv_ch5
    unit: °C
