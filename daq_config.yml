calc_tasks:
# ========== 3 上下 PT100 CH1 CH2 CH3  SV:CH5 CH6 ==========
- channel_name: "L3_SVCH5 | min(max(sv5*10+(175-t1)*10,1500),2500)"
  channel_prefix: calc_live_ch5
  formula: min(max(sv5*10+(175-t1)*10,1500),2500)
  offset: 0.0
  scale: 1.0
  task_id: calc_live_ch5_1785919067211
  unit: ℃
- channel_name: "L3_SVCH6 | min(max(sv6*10+(t1-t3)*10,1500),2500)"
  channel_prefix: calc_live_ch6
  formula: min(max(sv6*10+(t1-t3)*10,1500),2500)
  offset: 0.0
  scale: 1.0
  task_id: calc_live_ch6_1785919067212
  unit: ℃
- channel_name: "L3_SV‑实际温度差CH5 | sv5-t1"
  channel_prefix: calc_live_ch5_diff
  formula: sv5-t1
  offset: 0.0
  scale: 1.0
  task_id: calc_diff_3layer_01
  unit: ℃
- channel_name: "L3倾斜(CH1‑CH3) | t1-t3"
  channel_prefix: calc_3layer_tilt
  formula: t1-t3
  offset: 0.0
  scale: 1.0
  task_id: calc_tilt_3layer
  unit: ℃
- channel_name: "L3中心差 ((CH2*2‑CH1‑CH3)*0.5) | (t2*2-t1-t3)*0.5"
  channel_prefix: calc_3layer_center_diff
  formula: (t2*2-t1-t3)*0.5
  offset: 0.0
  scale: 1.0
  task_id: calc_center_3layer
  unit: ℃
- channel_name: "L3PWM | min(max((L3PWM-(t2*2-t1-t3)*0.5),0),100)"
  channel_prefix: calc_3layer_pwm
  formula: min(max((L3PWM-(t2*2-t1-t3)*0.5),0),100)
  offset: 0.0
  scale: 1.0
  task_id: calc_pwm_3layer
  unit: '%'
# ========== 4 上上 PT100 CH4 CH5 CH6  SV:CH7 CH8 ==========
# 【已修正：sv7/sv8接反对调】calc_live_ch7 使用 sv8；calc_live_ch8 使用 sv7
- channel_name: "L4_SV7 | min(max(sv8*10+(175-t4)*10,1500),2500)"
  channel_prefix: calc_live_ch7
  formula: min(max(sv8*10+(175-t4)*10,1500),2500)
  offset: 0.0
  scale: 1.0
  task_id: calc_live_ch7_1785919067213
  unit: ℃
- channel_name: "L4_SV8 | min(max(sv7*10+(t4-t6)*10,1500),2500)"
  channel_prefix: calc_live_ch8
  formula: min(max(sv7*10+(t4-t6)*10,1500),2500)
  offset: 0.0
  scale: 1.0
  task_id: calc_live_ch8_1785919067214
  unit: ℃
- channel_name: "L4_SV‑实际温度差CH7 | sv7-t4"
  channel_prefix: calc_live_ch7_diff
  formula: sv7-t4
  offset: 0.0
  scale: 1.0
  task_id: calc_diff_4layer_01
  unit: ℃
- channel_name: "L4倾斜(CH4‑CH6) | t4-t6"
  channel_prefix: calc_4layer_tilt
  formula: t4-t6
  offset: 0.0
  scale: 1.0
  task_id: calc_tilt_4layer
  unit: ℃
- channel_name: "L4中心差 ((CH5*2‑CH4‑CH6)*0.5) | (t5*2-t4-t6)*0.5"
  channel_prefix: calc_4layer_center_diff
  formula: (t5*2-t4-t6)*0.5
  offset: 0.0
  scale: 1.0
  task_id: calc_center_4layer
  unit: ℃
- channel_name: "L4_PWM | min(max((L4_PWM-(t5*2-t4-t6)*0.5),0),100)"
  channel_prefix: calc_4layer_pwm
  formula: min(max((L4_PWM-(t5*2-t4-t6)*0.5),0),100)
  offset: 0.0
  scale: 1.0
  task_id: calc_pwm_4layer
  unit: '%'
calc_write_tasks:
# L3 CH5 CH6 寄存器4108、4109
- byte_order: abcd
  connection_id: dte_rtu_com9
  connection_type: modbus_rtu
  data_type: uint16
  device_type: holding
  name: L3CH5SV
  source_task_id: calc_live_ch5_1785919067211
  start_addr: 4108
  task_id: calc_write_sv_ch5_1785919993456
  write_interval: 1500.0
- byte_order: abcd
  connection_id: dte_rtu_com9
  connection_type: modbus_rtu
  data_type: uint16
  device_type: holding
  name: L3CH6SV
  source_task_id: calc_live_ch6_1785919067212
  start_addr: 4109
  task_id: calc_write_sv_ch6_1785919993457
  write_interval: 1500.0
# L4 CH7 CH8 寄存器4110、4111【已修正source_task_id对调】
- byte_order: abcd
  connection_id: dte_rtu_com9
  connection_type: modbus_rtu
  data_type: uint16
  device_type: holding
  name: L4CH7SV
  source_task_id: calc_live_ch8_1785919067214
  start_addr: 4110
  task_id: calc_write_sv_ch7_1785919993458
  write_interval: 1500.0
- byte_order: abcd
  connection_id: dte_rtu_com9
  connection_type: modbus_rtu
  data_type: uint16
  device_type: holding
  name: L4CH8SV
  source_task_id: calc_live_ch7_1785919067213
  start_addr: 4111
  task_id: calc_write_sv_ch8_1785919993459
  write_interval: 1500.0
# PWM输出到基恩士PLC
- byte_order: abcd
  connection_id: pwm_plc1
  connection_type: keyence
  data_type: uint16
  device_type: DM
  name: L3PWM
  source_task_id: calc_pwm_3layer
  start_addr: 15104
  task_id: pwm_3layer
  write_interval: 1500.0
- byte_order: abcd
  connection_id: pwm_plc1
  connection_type: keyence
  data_type: uint16
  device_type: DM
  name: L4_PWM
  source_task_id: calc_pwm_4layer
  start_addr: 15106
  task_id: pwm_4layer
  write_interval: 1500.0
connections:
  dte_rtu_com9:
    params:
      baudrate: 115200
      bytesize: 8
      parity: E
      port: COM9
      slave_id: 1
      stopbits: 1
      timeout: 1.0
    type: modbus_rtu
  pt100_rtu_com11:
    params:
      baudrate: 9600
      bytesize: 8
      parity: N
      port: COM11
      slave_id: 0
      stopbits: 1
      timeout: 1.0
    type: modbus_rtu
  pwm_plc1:
    params:
      host: 192.168.2.80
      port: 8501
      timeout: 3.0
      unit: 0
    type: keyence
