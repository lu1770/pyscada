# ================================================================
# Delta 温度控制器 Modbus RTU 配置 (按通道分任务)
# 设备假设: 具有相同寄存器映射的串口版温控器
# ================================================================

# ---------------------------
# 全局配置
# ---------------------------
poll_interval: 0.5

# ---------------------------
# 设备连接配置
# ---------------------------
connections:
  # Delta 温度控制器 (Modbus RTU)
  delta_tc_rtu:
    type: modbus_rtu
    params:
      # 串口名称 (Windows: COM1, COM3...; Linux: /dev/ttyUSB0, /dev/ttyS0...)
      port: COM23
      # 波特率 (需与设备拨码或设置一致，常用 9600 或 115200)
      baudrate: 38400
      # 数据位
      bytesize: 7
      # 校验位 (N: 无, E: 偶, O: 奇)
      parity: N
      # 停止位
      stopbits: 1
      # 从站地址 (1-247，需与设备站号拨码一致)
      slave_id: 1
      # 串口超时时间 (秒)
      timeout: 1.0

# ---------------------------
# 采集任务配置 (每个通道独立任务)
# ---------------------------
tasks:
  # ================================================================
  # 通道 1 (Channel 1)
  # ================================================================
  - task_id: ch1_pv_temp
    connection_id: delta_tc_rtu
    connection_type: modbus_rtu
    device_type: holding
    start_addr: 616       # X268H
    quantity: 1
    data_type: int16
    byte_order: abcd
    channel_prefix: CH1_PV
    channel_name: 通道1-当前温度
    unit: °C
    scale: 0.1
    offset: 0

  - task_id: ch1_sv_temp
    connection_id: delta_tc_rtu
    connection_type: modbus_rtu
    device_type: holding
    start_addr: 624       # X270H
    quantity: 1
    data_type: int16
    byte_order: abcd
    channel_prefix: CH1_SV
    channel_name: 通道1-设定温度
    unit: °C
    scale: 0.1
    offset: 0

  - task_id: ch1_output_power
    connection_id: delta_tc_rtu
    connection_type: modbus_rtu
    device_type: holding
    start_addr: 632       # X278H
    quantity: 1
    data_type: uint16
    byte_order: abcd
    channel_prefix: CH1_PWR
    channel_name: 通道1-输出功率
    unit: '%'
    scale: 1.0
    offset: 0

  # ================================================================
  # 通道 2 (Channel 2)
