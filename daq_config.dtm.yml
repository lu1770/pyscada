# ---------------------------
# 写入任务配置（设置SV值）
# ---------------------------
# 周期性向 DTM 写入各通道的 SV（设定温度）
# 注意: value 为原始寄存器值，实际温度 = value × 0.1
#       例如要设定 25.0°C，则 value: 250
write_tasks:
  # ==================== CH1 ====================
  - task_id: wtask_dtm_ch1_sv
    connection_id: delta_tc_ascii
    connection_type: modbus_ascii
    device_type: holding
    start_addr: 0            # H0x000 CH1 SV值
    value: 250.0             # 25.0°C (原始值 = 25.0 × 10)
    write_interval: 1.0
    data_type: uint16
    byte_order: abcd
    name: 设置CH1设定温度

  # ==================== CH2 ====================
  - task_id: wtask_dtm_ch2_sv
    connection_id: delta_tc_ascii
    connection_type: modbus_ascii
    device_type: holding
    start_addr: 1            # H0x001 CH2 SV值
    value: 250.0
    write_interval: 1.0
    data_type: uint16
    byte_order: abcd
