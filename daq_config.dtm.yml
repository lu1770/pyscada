    connection_type: modbus_ascii
    device_type: holding
    start_addr: 4            # H0x004 CH5 SV值
    quantity: 1
    data_type: uint16
    byte_order: abcd
    channel_prefix: ch5
    channel_name: CH5设定温度
    unit: °C
