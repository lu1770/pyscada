    connection_id: delta_tc_ascii
    connection_type: modbus_ascii
    device_type: holding
    start_addr: 619          # H0x26B CH4 PV值
    quantity: 1
    data_type: uint16
    byte_order: abcd
    channel_prefix: ch4
    channel_name: CH4当前温度
    unit: °C
    scale: 0.1
    offset: 0

  - task_id: task_dtm_ch4_sv
    connection_id: delta_tc_ascii
    connection_type: modbus_ascii
    device_type: holding
    start_addr: 3            # H0x003 CH4 SV值
    quantity: 1
