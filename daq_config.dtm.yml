# ================================================================
# DTM温控器数据采集系统配置文件
# 设备型号: Delta DTM系列多回路温度控制器
# 支持: 8通道温度数据采集
# ================================================================

# ---------------------------
# 全局配置
# ---------------------------
poll_interval: 0.5  # 采集间隔(秒)

# ---------------------------
# 设备连接配置
# ---------------------------
connections:
  delta_tc_rtu:
    type: modbus_ascii
    params:
      port: COM23          # 串口名称
      baudrate: 38400      # 波特率
      bytesize: 7          # 数据位
      parity: E            # 校验位
      stopbits: 1          # 停止位
      slave_id: 1          # 从站地址
      timeout: 1.0         # 超时时间(秒)

# ---------------------------
# 采集任务配置
# ---------------------------
# 每个通道独立配置一个task，包含PV、SV、输出量等关键参数
# 地址映射基于DTM通讯寄存器表(3.10.2节)

tasks:
  # ===== 通道1 数据采集 =====
  - task_id: task_ch1_pv
    connection_id: delta_tc_rtu
    connection_type: modbus_rtu
    device_type: holding      # 保持寄存器
    start_addr: 616          # H0x268 通道1 PV值地址
    quantity: 1
    data_type: uint16
    byte_order: abcd
    channel_prefix: ch1
    channel_name: 通道1 PV值
    unit: °C
    scale: 0.1              # 实际值 = 原始值 × 0.1
    offset: 0

  - task_id: task_ch1_sv
    connection_id: delta_tc_rtu
    connection_type: modbus_rtu
    device_type: holding      # 保持寄存器
    start_addr: 0            # H0x000 通道1 SV值地址
    quantity: 1
    data_type: uint16
    byte_order: abcd
    channel_prefix: ch1
    channel_name: 通道1 SV值
    unit: °C
    scale: 0.1
    offset: 0

  - task_id: task_ch1_out1
    connection_id: delta_tc_rtu
    connection_type: modbus_rtu
    device_type: holding
    start_addr: 632          # H0x278 通道1 输出1操作量
    quantity: 1
    data_type: uint16
    byte_order: abcd
    channel_prefix: ch1
    channel_name: 通道1 输出1
    unit: '%'
    scale: 0.1
    offset: 0

  - task_id: task_ch1_out2
    connection_id: delta_tc_rtu
    connection_type: modbus_rtu
    device_type: holding
    start_addr: 640          # H0x280 通道1 输出2操作量
    quantity: 1
    data_type: uint16
    byte_order: abcd
    channel_prefix: ch1
    channel_name: 通道1 输出2
    unit: '%'
    scale: 0.1
    offset: 0

  # ===== 通道2 数据采集 =====
