    connection_id: delta_tc_ascii
    connection_type: modbus_ascii
    device_type: holding
    start_addr: 618          # H0x26A CH3 PV值
    quantity: 1
    data_type: uint16
    byte_order: abcd
    channel_prefix: ch3
    channel_name: CH3当前温度
    unit: °C
    scale: 0.1
    offset: 0

  - task_id: task_dtm_ch3_sv
    connection_id: delta_tc_ascii
    connection_type: modbus_ascii
    device_type: holding
    start_addr: 2            # H0x002 CH3 SV值
