# ================================================================
# DTM温控器数据采集系统配置文件
# 设备型号: Delta DTM系列多回路温度控制器
# 支持: 8通道温度数据采集（PV读取 + SV设置）
#
# 地址映射基于 DTM通讯寄存器表 (docs/DTM.md)
#   PV值: 0x268 ~ 0x26F (十进制 616 ~ 623) — 只读
#   SV值: 0x000 ~ 0x007 (十进制   0 ~   7) — 读/写
# ================================================================

# ---------------------------
# 全局配置
# ---------------------------
poll_interval: 0.5  # 采集间隔(秒)

# ---------------------------
# 设备连接配置
# ---------------------------
connections:
  delta_tc_ascii:
    type: modbus_ascii
    params:
      port: COM23          # 串口名称
      baudrate: 38400      # 波特率
      bytesize: 7          # 数据位
      parity: E            # 校验位 (E=偶校验)
      stopbits: 1          # 停止位
      slave_id: 1          # 从站地址
      timeout: 1.0         # 超时时间(秒)

# ---------------------------
# 采集任务配置（读取）
# ---------------------------
# 读取 DTM 各通道的 PV（当前温度）和 SV（设定温度）
# scale=0.1 即寄存器值 × 0.1 = 实际温度(°C)

tasks:
  # ==================== CH1 ====================
  - task_id: task_dtm_ch1_pv
    connection_id: delta_tc_ascii
    connection_type: modbus_ascii
    device_type: holding
    start_addr: 616          # H0x268 CH1 PV值 (测量温度)
    quantity: 1
    data_type: uint16
    byte_order: abcd
    channel_prefix: ch1
    channel_name: CH1当前温度
    unit: °C
    scale: 0.1
    offset: 0

  - task_id: task_dtm_ch1_sv
    connection_id: delta_tc_ascii
    connection_type: modbus_ascii
    device_type: holding
    start_addr: 0            # H0x000 CH1 SV值 (设定温度)
    quantity: 1
    data_type: uint16
    byte_order: abcd
    channel_prefix: ch1
    channel_name: CH1设定温度
    unit: °C
    scale: 0.1
    offset: 0

  # ==================== CH2 ====================
  - task_id: task_dtm_ch2_pv
    connection_id: delta_tc_ascii
    connection_type: modbus_ascii
    device_type: holding
    start_addr: 617          # H0x269 CH2 PV值
    quantity: 1
    data_type: uint16
    byte_order: abcd
    channel_prefix: ch2
    channel_name: CH2当前温度
    unit: °C
    scale: 0.1
    offset: 0

  - task_id: task_dtm_ch2_sv
    connection_id: delta_tc_ascii
    connection_type: modbus_ascii
    device_type: holding
    start_addr: 1            # H0x001 CH2 SV值
    quantity: 1
    data_type: uint16
    byte_order: abcd
    channel_prefix: ch2
    channel_name: CH2设定温度
    unit: °C
    scale: 0.1
    offset: 0

  # ==================== CH3 ====================
