  task_id: calc_power_ch5
  unit: '%'
- channel_name: CH6输出功率调节值
  channel_prefix: calc_power_ch6
  formula: min(max(task_out1_ch6+(180-task_temp_ch6)*1000,0),1000)
  offset: 0.0
  scale: 1.0
  task_id: calc_power_ch6
  unit: '%'
