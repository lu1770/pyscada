calc_tasks:
- channel_name: 下层SV实时CH1
  channel_prefix: calc_live_ch1
  formula: min(max(task_sv_ch1*10+(180-task_temp_ch1)*10,1500),2500)
  offset: 0.0
  scale: 1.0
  task_id: calc_1785919067200
  unit: ℃
- channel_name: 下层SV实时CH2
  channel_prefix: calc_live_ch2
  formula: min(max(task_sv_ch2*10+(task_temp_ch1-task_temp_ch3)*10,1500),2500)
  offset: 0.0
  scale: 1.0
  task_id: calc_live_ch2_1785919067201
  unit: ℃
- channel_name: 上层SV实时CH3
  channel_prefix: calc_live_ch3
  formula: min(max(task_sv_ch3*10+(180-task_temp_ch4)*10,1500),2500)
  offset: 0.0
  scale: 1.0
  task_id: calc_1785919067203
  unit: ℃
- channel_name: 上层SV实时CH4
  channel_prefix: calc_live_ch4
  formula: min(max(task_sv_ch4*10+(task_temp_ch4-task_temp_ch6)*10,1500),2500)
  offset: 0.0
  scale: 1.0
  task_id: calc_live_ch4_1785919067204
  unit: ℃
- channel_name: 上层SV实时CH3与设定温度差
  channel_prefix: calc_live_ch3_diff
  formula: task_sv_ch3-task_temp_ch4
  offset: 0.0
  scale: 1.0
  task_id: calc_1785919067205
  unit: ℃
- channel_name: 下层SV实时CH1与设定温度差
  channel_prefix: calc_live_ch1_diff
  formula: task_sv_ch1-task_temp_ch1
  offset: 0.0
  scale: 1.0
  task_id: calc_1785919067204
  unit: ℃
- channel_name: 上层倾斜
  channel_prefix: calc_upper_tilt
  formula: task_temp_ch4-task_temp_ch6
  offset: 0.0
  scale: 1.0
  task_id: calc_1785919067206
  unit: ℃
- channel_name: 下层倾斜
  channel_prefix: calc_lower_tilt
  formula: task_temp_ch1-task_temp_ch3
  offset: 0.0
  scale: 1.0
  task_id: calc_1785919067202
  unit: ℃
- channel_name: 上层中心差
  channel_prefix: calc_upper_center_diff
  formula: (task_temp_ch5*2-task_temp_ch4-task_temp_ch6)*0.5
  offset: 0.0
  scale: 1.0
  task_id: calc_center_1785919067207
  unit: ℃
- channel_name: 下层中心差
  channel_prefix: calc_lower_center_diff
  formula: (task_temp_ch2*2-task_temp_ch1-task_temp_ch3)*0.5
  offset: 0.0
  scale: 1.0
  task_id: calc_center_1785919067208
  unit: ℃
- channel_name: 下层PWM调节值
  channel_prefix: calc_lower_pwm
  formula: min(max((heater_duty_lower_mid-(task_temp_ch2*2-task_temp_ch1-task_temp_ch3)*0.5),0),100)
  offset: 0.0
  scale: 1.0
  task_id: calc_pwm_1785919067209
  unit: '%'
- channel_name: 中层下面PWM调节值
  channel_prefix: calc_mid_lower_pwm
  formula: min(max((heater_duty_mid_lower_mid-(task_temp_ch5*2-task_temp_ch4-task_temp_ch6)*0.5),0),100)
  offset: 0.0
  scale: 1.0
  task_id: calc_pwm_1785919067210
  unit: '%'
- channel_name: CH1输出功率调节值
  channel_prefix: calc_power_ch1
  formula: min(max(task_out1_ch1+(180-task_temp_ch1)*1000,0),1000)
  offset: 0.0
  scale: 1.0
  task_id: calc_power_ch1
  unit: '%'
- channel_name: CH2输出功率调节值
  channel_prefix: calc_power_ch2
  formula: min(max(task_out1_ch2+(180-task_temp_ch3)*1000,0),1000)
  offset: 0.0
  scale: 1.0
  task_id: calc_power_ch2
  unit: '%'
- channel_name: CH3输出功率调节值
  channel_prefix: calc_power_ch3
  formula: min(max(task_out1_ch3+(180-task_temp_ch4)*1000,0),1000)
  offset: 0.0
  scale: 1.0
  task_id: calc_power_ch3
  unit: '%'
- channel_name: CH4输出功率调节值
  channel_prefix: calc_power_ch4
  formula: min(max(task_out1_ch4+(180-task_temp_ch6)*1000,0),1000)
  offset: 0.0
  scale: 1.0
  task_id: calc_power_ch4
  unit: '%'
- channel_name: CH5输出功率调节值
