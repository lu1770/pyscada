calc_tasks:
  # ========== 1层 下模具下层 PT100: 左t1 中t2 右t3 | SV: 左sv1 右sv2 | PWM: DM15100 ==========
  - channel_name: "L1_SV_CH1 | min(max(sv1*10+(175-t1)*10,1500),2500)"
    channel_prefix: calc_live_ch1
    formula: min(max(sv1*10+(175-t1)*10,1500),2500)
    offset: 0.0
    scale: 1.0
    task_id: calc_live_ch1_1785919067201
    unit: ℃
  - channel_name: "L1_SV_CH2 | min(max(sv2*10+(t1-t3)*10,1500),2500)"
    channel_prefix: calc_live_ch2
    formula: min(max(sv2*10+(t1-t3)*10,1500),2500)
    offset: 0.0
    scale: 1.0
    task_id: calc_live_ch2_1785919067202
    unit: ℃
  - channel_name: "L1_PWM | min(max((L1PWM-(t2*2-t1-t3)*0.5),0),100)"
    channel_prefix: calc_pwm_1layer
    formula: min(max((L1PWM-(t2*2-t1-t3)*0.5),0),100)
    offset: 0.0
    scale: 1.0
    task_id: calc_pwm_1layer
    unit: '%'
  # 监控计算
  - channel_name: "L1倾斜(CH1‑CH3) | t1-t3"
    channel_prefix: calc_1layer_tilt
    formula: t1-t3
    offset: 0.0
    scale: 1.0
    task_id: calc_tilt_1layer
    unit: ℃
  - channel_name: "L1中心差 | (t2*2-t1-t3)*0.5"
    channel_prefix: calc_1layer_center_diff
    formula: (t2*2-t1-t3)*0.5
    offset: 0.0
    scale: 1.0
    task_id: calc_center_1layer
    unit: ℃

  # ========== 2层 下模具上层 PT100: 左t4 中t5 右t6 | SV: 左sv3 右sv4 | PWM: DM15102 ==========
  - channel_name: "L2_SV_CH3 | min(max(sv3*10+(175-t4)*10,1500),2500)"
    channel_prefix: calc_live_ch3
    formula: min(max(sv3*10+(175-t4)*10,1500),2500)
    offset: 0.0
    scale: 1.0
    task_id: calc_live_ch3_1785919067203
    unit: ℃
  - channel_name: "L2_SV_CH4 | min(max(sv4*10+(t4-t6)*10,1500),2500)"
    channel_prefix: calc_live_ch4
    formula: min(max(sv4*10+(t4-t6)*10,1500),2500)
    offset: 0.0
    scale: 1.0
    task_id: calc_live_ch4_1785919067204
    unit: ℃
  - channel_name: "L2_PWM | min(max((L2PWM-(t5*2-t4-t6)*0.5),0),100)"
    channel_prefix: calc_pwm_2layer
    formula: min(max((L2PWM-(t5*2-t4-t6)*0.5),0),100)
    offset: 0.0
    scale: 1.0
    task_id: calc_pwm_2layer
    unit: '%'
  # 监控计算
  - channel_name: "L2倾斜(CH4‑CH6) | t4-t6"
    channel_prefix: calc_2layer_tilt
    formula: t4-t6
    offset: 0.0
    scale: 1.0
    task_id: calc_tilt_2layer
    unit: ℃
  - channel_name: "L2中心差 | (t5*2-t4-t6)*0.5"
    channel_prefix: calc_2layer_center_diff
    formula: (t5*2-t4-t6)*0.5
    offset: 0.0
    scale: 1.0
    task_id: calc_center_2layer
    unit: ℃

  # ========== 3层 上模具下层 PT100: 左t7 中t8 右t9 | SV: 左sv5 右sv6 | PWM: DM15104 ==========
  - channel_name: "L3_SV_CH5 | min(max(sv5*10+(175-t7)*10,1500),2500)"
    channel_prefix: calc_live_ch5
    formula: min(max(sv5*10+(175-t7)*10,1500),2500)
    offset: 0.0
    scale: 1.0
    task_id: calc_live_ch5_1785919067211
    unit: ℃
  - channel_name: "L3_SV_CH6 | min(max(sv6*10+(t7-t9)*10,1500),2500)"
    channel_prefix: calc_live_ch6
    formula: min(max(sv6*10+(t7-t9)*10,1500),2500)
    offset: 0.0
    scale: 1.0
    task_id: calc_live_ch6_1785919067212
    unit: ℃
  - channel_name: "L3_PWM | min(max((L3PWM-(t8*2-t7-t9)*0.5),0),100)"
    channel_prefix: calc_pwm_3layer
    formula: min(max((L3PWM-(t8*2-t7-t9)*0.5),0),100)
    offset: 0.0
    scale: 1.0
    task_id: calc_pwm_3layer
    unit: '%'
  # 监控计算
  - channel_name: "L3倾斜(CH7‑CH9) | t7-t9"
    channel_prefix: calc_3layer_tilt
    formula: t7-t9
    offset: 0.0
    scale: 1.0
    task_id: calc_tilt_3layer
    unit: ℃
  - channel_name: "L3中心差 | (t8*2-t7-t9)*0.5"
    channel_prefix: calc_3layer_center_diff
    formula: (t8*2-t7-t9)*0.5
    offset: 0.0
    scale: 1.0
    task_id: calc_center_3layer
    unit: ℃

  # ========== 4层 上模具上层 PT100: 左t10 中t11 右t12 | SV: 左sv7 右sv8 | PWM: DM15106 ==========
  # 更正：4层左侧sv7，右侧sv8
  - channel_name: "L4_SV_CH7(左) | min(max(sv7*10+(175-t10)*10,1500),2500)"
