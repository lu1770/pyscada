    formula: min(max(sv8*10+(t10-t12)*10,1500),2500)
    offset: 0.0
    scale: 1.0
    task_id: calc_live_ch8_1785919067214
    unit: ℃
  - channel_name: "L4_PWM | min(max((L4_PWM-(t11*2-t10-t12)*0.5),0),100)"
    channel_prefix: calc_pwm_4layer
    formula: min(max((L4_PWM-(t11*2-t10-t12)*0.5),0),100)
    offset: 0.0
    scale: 1.0
    task_id: calc_pwm_4layer
    unit: '%'
  # 监控计算
  - channel_name: "L4倾斜(CH10‑CH12) | t10-t12"
    channel_prefix: calc_4layer_tilt
    formula: t10-t12
    offset: 0.0
    scale: 1.0
    task_id: calc_tilt_4layer
    unit: ℃
  - channel_name: "L4中心差 | (t11*2-t10-t12)*0.5"
    channel_prefix: calc_4layer_center_diff
    formula: (t11*2-t10-t12)*0.5
    offset: 0.0
    scale: 1.0
    task_id: calc_center_4layer
    unit: ℃

calc_write_tasks:
  # L1 CH1 CH2 寄存器4104、4105
  - byte_order: abcd
    connection_id: dte_rtu_com9
    connection_type: modbus_rtu
    data_type: uint16
    device_type: holding
    name: L1CH1SV
    source_task_id: calc_live_ch1_1785919067201
    start_addr: 4104
    task_id: calc_write_sv_ch1_1785919993450
    write_interval: 1500.0
  - byte_order: abcd
    connection_id: dte_rtu_com9
    connection_type: modbus_rtu
    data_type: uint16
    device_type: holding
    name: L1CH2SV
    source_task_id: calc_live_ch2_1785919067202
    start_addr: 4105
    task_id: calc_write_sv_ch2_1785919993451
