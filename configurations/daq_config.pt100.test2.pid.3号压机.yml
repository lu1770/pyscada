connections:
  dte_rtu_com9:
    params:
      baudrate: 115200
      bytesize: 8
      parity: E
      port: COM9
      slave_id: 1
      stopbits: 1
      timeout: 1.0
    type: modbus_rtu
  pt100_rtu_com11:
    params:
      baudrate: 9600
      bytesize: 8
      parity: N
      port: COM11
      slave_id: 0
      stopbits: 1
      timeout: 1.0
    type: modbus_rtu
  pwm_plc1:
    params:
      host: 192.168.2.80
      port: 8501
      timeout: 3.0
      unit: 0
    type: keyence

