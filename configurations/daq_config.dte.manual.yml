    offset: 0

  - task_id: task_out1_ch5
    connection_id: delta_dte10t
    connection_type: modbus_rtu
    device_type: holding
    start_addr: 4212
    quantity: 1
    data_type: uint16
    byte_order: abcd
    channel_prefix: out1_ch5
