# ================================================================
# 台达 DELTA DTE10T 温度控制器 - 配置文件
# 功能: 将全部 8 通道切换为手动模式，并写入输出功率 50%
# ================================================================

# ---------------------------
# 全局配置
# ---------------------------
poll_interval: 0.5

# ---------------------------
# 设备连接配置
# ---------------------------
connections:
  delta_dte10t:
    type: modbus_rtu
    params:
      port: COM8
      baudrate: 115200
      bytesize: 8
      parity: E
      stopbits: 1
      slave_id: 1
      timeout: 1.0

# ---------------------------
# 采集任务配置（读取通道状态）
# ---------------------------
tasks:
  # 第一组输出功率（CH1~CH8），单位 0.1%
  - task_id: task_out1_ch1
    connection_id: delta_dte10t
    connection_type: modbus_rtu
    device_type: holding
    start_addr: 4208
    quantity: 1
    data_type: uint16
    byte_order: abcd
    channel_prefix: out1_ch1
    channel_name: CH1输出功率1
    unit: '%'
    scale: 0.1
    offset: 0

  - task_id: task_out1_ch2
    connection_id: delta_dte10t
    connection_type: modbus_rtu
    device_type: holding
    start_addr: 4209
    quantity: 1
    data_type: uint16
    byte_order: abcd
    channel_prefix: out1_ch2
    channel_name: CH2输出功率1
    unit: '%'
    scale: 0.1
    offset: 0

  - task_id: task_out1_ch3
    connection_id: delta_dte10t
    connection_type: modbus_rtu
    device_type: holding
    start_addr: 4210
    quantity: 1
    data_type: uint16
