calc_tasks:
# ========== 3 上下 PT100 CH1 CH2 CH3  SV:CH5 CH6 ==========
- channel_name: "3上下SVCH5 | min(max(task_sv_ch5*10+(175-task_temp_ch1)*10,1500),2500)"
  channel_prefix: calc_live_ch5
  formula: min(max(task_sv_ch5*10+(175-task_temp_ch1)*10,1500),2500)
  offset: 0.0
  scale: 1.0
  task_id: calc_live_ch5_1785919067211
  unit: ℃
- channel_name: "3上下SVCH6 | min(max(task_sv_ch6*10+(task_temp_ch1-task_temp_ch3)*10,1500),2500)"
  channel_prefix: calc_live_ch6
  formula: min(max(task_sv_ch6*10+(task_temp_ch1-task_temp_ch3)*10,1500),2500)
  offset: 0.0
  scale: 1.0
  task_id: calc_live_ch6_1785919067212
  unit: ℃
- channel_name: "3上下SV‑实际温度差CH5 | task_sv_ch5-task_temp_ch1"
  channel_prefix: calc_live_ch5_diff
  formula: task_sv_ch5-task_temp_ch1
  offset: 0.0
  scale: 1.0
  task_id: calc_diff_3layer_01
  unit: ℃
- channel_name: "3上下倾斜(CH1‑CH3) | task_temp_ch1-task_temp_ch3"
  channel_prefix: calc_3layer_tilt
  formula: task_temp_ch1-task_temp_ch3
  offset: 0.0
  scale: 1.0
  task_id: calc_tilt_3layer
  unit: ℃
- channel_name: "3上下中心差 ((CH2*2‑CH1‑CH3)*0.5) | (task_temp_ch2*2-task_temp_ch1-task_temp_ch3)*0.5"
  channel_prefix: calc_3layer_center_diff
  formula: (task_temp_ch2*2-task_temp_ch1-task_temp_ch3)*0.5
  offset: 0.0
  scale: 1.0
  task_id: calc_center_3layer
  unit: ℃
- channel_name: "3上下PWM调节值 | min(max((heater_duty_mid_upper_mid-(task_temp_ch2*2-task_temp_ch1-task_temp_ch3)*0.5),0),100)"
  channel_prefix: calc_3layer_pwm
  formula: min(max((heater_duty_mid_upper_mid-(task_temp_ch2*2-task_temp_ch1-task_temp_ch3)*0.5),0),100)
  offset: 0.0
  scale: 1.0
  task_id: calc_pwm_3layer
  unit: '%'
# ========== 4 上上 PT100 CH4 CH5 CH6  SV:CH7 CH8 ==========
# 【已修正：sv7/sv8接反对调】calc_live_ch7 使用 task_sv_ch8；calc_live_ch8 使用 task_sv_ch7
- channel_name: "4上上SVCH7 | min(max(task_sv_ch8*10+(175-task_temp_ch4)*10,1500),2500)"
  channel_prefix: calc_live_ch7
  formula: min(max(task_sv_ch8*10+(175-task_temp_ch4)*10,1500),2500)
  offset: 0.0
  scale: 1.0
  task_id: calc_live_ch7_1785919067213
  unit: ℃
- channel_name: "4上上SVCH8 | min(max(task_sv_ch7*10+(task_temp_ch4-task_temp_ch6)*10,1500),2500)"
  channel_prefix: calc_live_ch8
  formula: min(max(task_sv_ch7*10+(task_temp_ch4-task_temp_ch6)*10,1500),2500)
  offset: 0.0
  scale: 1.0
  task_id: calc_live_ch8_1785919067214
  unit: ℃
- channel_name: "4上上SV‑实际温度差CH7 | task_sv_ch7-task_temp_ch4"
  channel_prefix: calc_live_ch7_diff
  formula: task_sv_ch7-task_temp_ch4
  offset: 0.0
  scale: 1.0
  task_id: calc_diff_4layer_01
  unit: ℃
- channel_name: "4上上倾斜(CH4‑CH6) | task_temp_ch4-task_temp_ch6"
  channel_prefix: calc_4layer_tilt
  formula: task_temp_ch4-task_temp_ch6
  offset: 0.0
  scale: 1.0
  task_id: calc_tilt_4layer
  unit: ℃
- channel_name: "4上上中心差 ((CH5*2‑CH4‑CH6)*0.5) | (task_temp_ch5*2-task_temp_ch4-task_temp_ch6)*0.5"
  channel_prefix: calc_4layer_center_diff
  formula: (task_temp_ch5*2-task_temp_ch4-task_temp_ch6)*0.5
  offset: 0.0
  scale: 1.0
  task_id: calc_center_4layer
  unit: ℃
- channel_name: "4上上PWM调节值 | min(max((heater_duty_upper_mid-(task_temp_ch5*2-task_temp_ch4-task_temp_ch6)*0.5),0),100)"
  channel_prefix: calc_4layer_pwm
  formula: min(max((heater_duty_upper_mid-(task_temp_ch5*2-task_temp_ch4-task_temp_ch6)*0.5),0),100)
  offset: 0.0
  scale: 1.0
  task_id: calc_pwm_4layer
  unit: '%'
calc_write_tasks:
# 3上下 CH5 CH6 寄存器4108、4109
- byte_order: abcd
  connection_id: dte_rtu_com9
  connection_type: modbus_rtu
  data_type: uint16
  device_type: holding
  name: 3上下CH5SV
  source_task_id: calc_live_ch5_1785919067211
  start_addr: 4108
  task_id: calc_write_sv_ch5_1785919993456
  write_interval: 1500.0
- byte_order: abcd
  connection_id: dte_rtu_com9
  connection_type: modbus_rtu
  data_type: uint16
  device_type: holding
  name: 3上下CH6SV
  source_task_id: calc_live_ch6_1785919067212
  start_addr: 4109
  task_id: calc_write_sv_ch6_1785919993457
  write_interval: 1500.0
# 4上上 CH7 CH8 寄存器4110、4111【已修正source_task_id对调】
- byte_order: abcd
  connection_id: dte_rtu_com9
  connection_type: modbus_rtu
  data_type: uint16
  device_type: holding
  name: 4上上CH7SV
  source_task_id: calc_live_ch8_1785919067214
  start_addr: 4110
  task_id: calc_write_sv_ch7_1785919993458
  write_interval: 1500.0
- byte_order: abcd
  connection_id: dte_rtu_com9
  connection_type: modbus_rtu
  data_type: uint16
  device_type: holding
  name: 4上上CH8SV
  source_task_id: calc_live_ch7_1785919067213
  start_addr: 4111
  task_id: calc_write_sv_ch8_1785919993459
  write_interval: 1500.0
# PWM输出到基恩士PLC
- byte_order: abcd
  connection_id: pwm_plc1
  connection_type: keyence
  data_type: uint16
  device_type: DM
  name: 3上下PWM调节值
  source_task_id: calc_pwm_3layer
  start_addr: 15104
  task_id: pwm_3layer
  write_interval: 1500.0
- byte_order: abcd
  connection_id: pwm_plc1
  connection_type: keyence
  data_type: uint16
  device_type: DM
  name: 4上上PWM调节值
  source_task_id: calc_pwm_4layer
  start_addr: 15106
  task_id: pwm_4layer
  write_interval: 1500.0
connections:
  dte_rtu_com9:
    params:
      baudrate: 115200
      bytesize: 8
      parity: E
      port: COM9
      slave_id: 1
      stopbits: 1
      timeout: 1.0
    type: modbus_rtu
  pt100_rtu_com11:
    params:
      baudrate: 9600
      bytesize: 8
      parity: N
      port: COM11
      slave_id: 0
      stopbits: 1
      timeout: 1.0
    type: modbus_rtu
  pwm_plc1:
    params:
      host: 192.168.2.80
      port: 8501
      timeout: 3.0
      unit: 0
    type: keyence
