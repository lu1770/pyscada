# ================================================================
# 合并配置文件: Delta DTE10T + Delta DTM系列温控器数据采集系统
# ================================================================

# ---------------------------
# 全局配置
# ---------------------------
poll_interval: 0.5

# ---------------------------
# 设备连接配置
# ---------------------------
connections:
  delta_dte10t:
    params:
      baudrate: 115200
      bytesize: 8
      parity: E
      port: COM8
      slave_id: 1
      stopbits: 1
    type: modbus_rtu

  delta_tc_rtu:
    type: modbus_ascii
    params:
      port: COM23
      baudrate: 38400
      bytesize: 7
      parity: E
      stopbits: 1
      slave_id: 1
      timeout: 1.0

# ---------------------------
# 采集任务配置
# ---------------------------
# DTE10T设备任务 (32个任务)
# DTM系列设备任务 (32个任务)
