# ================================================================
# 多通道工业数据采集系统 - 配置文件
# 支持设备: Modbus RTU
# ================================================================

# ---------------------------
# 全局配置
# ---------------------------
# 采集间隔（秒），控制轮询频率
poll_interval: 0.5


# ---------------------------
# 设备连接配置
# ---------------------------
# 定义所有需要连接的设备
# 支持的连接类型: modbus_rtu
connections:
  # Modbus RTU 温度采集设备
  pt100_rtu_com11:
    type: modbus_rtu
    params:
      # 串口名称
      port: COM11
      # 波特率（常用: 9600, 19200, 38400, 57600, 115200）
      baudrate: 9600
      # 数据位（通常为8）
      bytesize: 8
      # 校验位（N: 无校验, E: 偶校验, O: 奇校验）
      parity: N
      # 停止位（通常为1）
      stopbits: 1
      # 从站地址（1-247）
      slave_id: 0
      # 通信超时（秒），默认1.0
      timeout: 1.0

  keyence_pwm_plc1:
    # 连接类型: keyence
    type: keyence
    params:
      # PLC 主机IP地址
      host: 192.168.2.80
      # Keyence 协议端口（通常为3000）
      port: 8501
      # PLC单元号（通常为0）
      unit: 0
      # 通信超时（秒），默认3.0
      timeout: 3.0


# ---------------------------
# 采集任务配置
# ---------------------------
# 定义所有需要采集的数据点
# 寄存器 0x00-0x0F 对应第 1-16 路温度，整型格式（uint16）
tasks:
  - task_id: task_temp_ch1
    connection_id: pt100_rtu_com11
    connection_type: modbus_rtu
    device_type: holding
    start_addr: 0x00
    quantity: 1
    data_type: uint16
    byte_order: abcd
    channel_prefix: temp
    channel_name: 第1路温度
    unit: °C
    scale: 0.01
    offset: 0

