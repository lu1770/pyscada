# Modbus TCP/RTU 服务端配置文件（全功能码版）
#
# 支持两种写法：
#   1) servers 列表：一个配置文件同时启动多个服务端，可混合 tcp / rtu
#   2) 旧版写法：顶层单个 server 块（仅启动一个服务端）
# server 条目未定义 identity / datastore / areas 时，自动回退到顶层定义；
# 此时多个 server 共享同一份数据区（状态互通），需要独立数据状态的 server
# 在自己的条目里定义 areas/datastore 即可。

# ---------------- 共享配置（server 条目未指定时回退到这里） ----------------
identity:                            # 可选：功能码 43/14 Read Device Identification 用
  vendor_name: "MyCompany"
  product_code: "PY-MB-SIM"
  vendor_url: "https://example.com"
  product_name: "Modbus TCP Simulator"
  model_name: "Sim-1"
  major_minor_revision: "1.0"

datastore:                           # 可选：每个区不指定则默认100
  coils_size: 100
  discrete_inputs_size: 100
  input_registers_size: 100
  holding_registers_size: 100

areas:
  # ---------------- 线圈 Coils（功能码 01 读 / 05 06写单个 / 15 写多个）----------------
  coils:
    - address: 0
      count: 8
      type: fixed
      value: false

    - address: 8
      count: 8
      type: toggle          # 每次读取 True/False 交替

    - address: 16
      count: 8
      type: static          # 可写：主站用05/15写入后，读回的就是写入的值
      value: false

  # ---------------- 离散输入 Discrete Inputs（只读，功能码 02）----------------
  discrete_inputs:
    - address: 0
      count: 8
      type: random

  # ---------------- 输入寄存器 Input Registers（只读，功能码 04）----------------
  input_registers:
    - address: 0
      count: 10
      type: random
      min: 0
      max: 1000

  # ---------------- 保持寄存器 Holding Registers ----------------
  # 功能码 03读 / 06写单个 / 16写多个 / 22掩码写 / 23读写多个
  holding_registers:
    - address: 0
      count: 10
      type: random
      min: 0
      max: 65535

    - address: 10
      count: 5
      type: fixed
      value: 1234

    - address: 20
      count: 5
      type: increment
      start: 0
      step: 1
      min: 0
      max: 100
      wrap: true

    - address: 40
      count: 10
      type: static           # 可写：主站用06/16/22写入后，读回的就是写入的值
      value: 0

# ---------------- 服务端列表（可混合 tcp / rtu，全部同时启动） ----------------
servers:
  - name: "tcp-502"
    mode: tcp
    ip: "0.0.0.0"                    # mode: tcp 时的监听地址
    port: 502                        # mode: tcp 时的监听端口
    slave_id: 1

  - name: "rtu-com13"
    mode: rtu                        # mode: rtu（需 pip install pyserial）
    slave_id: 1
    serial:
      port: "COM13"                  # Windows: COM13；Linux: /dev/ttyUSB0
      baudrate: 9600
      bytesize: 8
      parity: "N"                    # N 无校验 / E 偶校验 / O 奇校验
      stopbits: 1
