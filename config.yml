# ModbusTCP 服务端配置文件

server:
  ip: "0.0.0.0"      # 监听地址，0.0.0.0 表示监听所有网卡
  port: 502           # 监听端口
  slave_id: 1         # 从站(Slave) ID

# datastore.size 可选：指定寄存器区间总大小（不小于下面配置的最大地址+1）
datastore:
  size: 100

# 寄存器配置：可以配置多段，每段一种模式
registers:
  # 地址 0~9：随机数，范围 0~65535
  - address: 0
    count: 10
    type: random
    min: 0
    max: 65535

  # 地址 10~14：固定值 1234
  - address: 10
    count: 5
    type: fixed
    value: 1234

  # 地址 20~24：自增长，从0开始，每次读取+1，到100后回绕到0
  - address: 20
    count: 5
    type: increment
    start: 0
    step: 1
    min: 0
    max: 100
    wrap: true

  # 地址 30：自增长，不回绕，到达max后停在max
  - address: 30
    count: 1
    type: increment
    start: 0
    step: 5
    min: 0
    max: 20
    wrap: false
